
services:
  auto-travel-blogger:
    build: .
    network_mode: host
    volumes:
      - ./:/app:rw
      - ~/.openclaw:/root/.openclaw:rw
      - ~/.gemini:/root/.gemini:ro
      - ./output:/app/output
    env_file:
      - ~/.openclaw/workspace/.env # ← thêm dòng này để load biến môi trường từ OpenClaw CLI
      - .env
    environment:
      - OUTPUT_DIR=/app/output
      - OPENCLAW_BIN=/root/.openclaw/tmp/node-compile-cache/openclaw 
    # The default command will be appended to the ENTRYPOINT in Dockerfile
    # Example usage: docker-compose run --rm auto-travel-blogger "Viết bài review về Đà Lạt"

