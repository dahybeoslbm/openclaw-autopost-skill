name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/.openclaw/workspace/skills/openclaw-autopost-skill
            git pull origin main

            COMMIT_MSG=$(git log -1 --pretty=%B)
            CHANGED=$(git diff --name-only HEAD@{1} HEAD)

            if echo "$CHANGED" | grep -qE "Dockerfile|docker-compose\.yml" || echo "$COMMIT_MSG" | grep -q "\[rebuild\]"; then
              echo "Rebuilding image..."
              docker compose up -d --build
            fi

            openclaw gateway restart

      - name: Notify success on Telegram
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🤖 Bé Báo Cáo đây! Hệ thống đã update xong, mọi người test thử nha ✅

            (repo: ${{ github.repository }} | commit: ${{ github.sha }})

      - name: Notify failure on Telegram
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🤖 Bé Báo Cáo báo cáo: update lần này bị lỗi rồi ạ ❌ Để IT kiểm tra giúp nha~

            (repo: ${{ github.repository }} | commit: ${{ github.sha }} | log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
